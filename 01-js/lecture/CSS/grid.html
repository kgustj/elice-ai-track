<!DOCTYPE html>
<html>
    <head>
        <title>Holy Grail Layout</title>
        <style>
            #container {
                display: grid;
                grid-template-columns: 1fr 2fr 1fr;
            }
            div {
                border: 10px solid red;
                margin: 5px;
            }
        </style>
    </head>
    <body>
        <div>TOP</div>
        <div id="container">
            <div>LEFT</div>
            <div>CENTER</div>
            <div>RIGHT</div>
        </div>
        <div>BOTTOM</div>
    </body>
</html>
