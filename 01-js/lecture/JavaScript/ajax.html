<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AJAX</title>
    </head>
    <body>
        <!-- <input
            type="button"
            value="GET"
            onclick="
            fetch('http://localhost:3000/topics')
            .then(response => response.json())
            .then(data => {
                let lis = '';

                    lis = lis + `<li>${data[i].title}</li>`;
                }
                document.querySelector('nav>ul').innerHTML = lis;

        <input type="button" value="GET" class="get_db" />
        <input type="button" value="CREATE" class="create_db" />
        <input type="button" value="GET" class="placeholder" />
        <nav>
            <ul></ul>
        </nav>
        <script>
            document.querySelector(".get_db").addEventListener("click", function () {
                fetch("http://localhost:3000/topics")
                    .then((response) => response.json())
                    .then((data) => {
                        console.log(data);
                        let lis = "";
                        for (let i = 0; i < data.length; i++) {
                            console.log(data[i]);
                            lis += `<li>${data[i].title}</li>`;
                        }
                        document.querySelector("nav>ul").innerHTML = lis;
                    });
            });
            document.querySelector(".create_db").addEventListener("click", function () {
                fetch("http://localhost:3000/topics", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        title: prompt("title?"),
                        body: prompt("body?"),
                    }),
                })
                    .then((response) => response.json())
                    .then((data) => {
                        console.log(data);
                        let lis = "";
                        for (let i = 0; i < data.length; i++) {
                            console.log(data[i]);
                            lis += `<li>${data[i].title}</li>`;
                        }
                        document.querySelector("nav>ul").innerHTML = lis;
                    });
            });

            document.querySelector(".placeholder").addEventListener("click", function () {
                fetch("https://jsonplaceholder.typicode.com/posts")
                    .then((response) => response.json())
                    .then((data) => {
                        console.log(data);
                        let lis = "";
                        for (let i = 0; i < data.length; i++) {
                            console.log(data[i]);
                            lis += `<li>${data[i].title}</li>`;
                        }
                        document.querySelector("nav>ul").innerHTML = lis;
                    });
            });
        </script>
    </body>
</html>
