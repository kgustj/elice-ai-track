<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Loop</title>
    </head>
    <body>
        <h1>Loop</h1>
        <ul>
            <script>
                // for(초기값; 반복의조건; 무엇을 반복하는지){}
                const friends = ["egoing", "duru", "basta"];
                for (let i = 0; i < friends.length; i = i + 1) {
                    console.log(i, friends[i]);
                    document.write(`<li>${friends[i]}</li>`);
                }
            </script>
        </ul>
    </body>
</html>
