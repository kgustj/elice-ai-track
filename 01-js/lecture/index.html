<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>WEB</title>
    </head>
    <body>
        <h1>
            <a
                href="index.html"
                onclick="
                event.preventDefault();
                mode = 'WELCOME';
                article();"
                >WEB
            </a>
        </h1>
        <nav>
            <ol></ol>
        </nav>
        <article></article>
    </body>
    <script>
        let selectedId;
        let mode = "WELCOME";
        let object = [
            {
                id: 1,
                title: "HTML",
                body: "Html is html.",
            },
            {
                id: 2,
                title: "CSS",
                body: "Css is css.",
            },
        ];

        function nav() {
            let liTag = "";
            for (let i in object) {
                liTag += `<li>
                    <a href="${object[i].id}.html" onclick=
                    "event.preventDefault();
                    mode = 'READ';
                    selectedId = ${object[i].id};
                    article();
                    ">
                        ${object[i].title} 
                    </a>
                </li>`;
            }
            document.querySelector("ol").innerHTML += liTag;
        }
        nav();

        function article() {
            let articleTag = "";
            if (mode === "WELCOME") {
                articleTag = `<h2>${mode}</h2>Hello, WEB.`;
            } else if (mode === "READ") {
                let body, title;
                for (let i in object) {
                    if (object[i].id === selectedId) {
                        title = object[i].title;
                        body = object[i].body;
                        break;
                    }
                }
                articleTag = `<h2>${title}</h2>${body}`;
            }
            document.querySelector("article").innerHTML = articleTag;
        }
        article();

        // 정공법
        // const text = document.createTextNode("HTML");
        // let a = document.createElement("a"),
        //     li = document.createElement("li");
        // a.setAttribute("href", "1.html");
        // a.appendChild(text);
        // li.appendChild(a);
        // document.querySelector("ol").appendChild(li);
    </script>
</html>
